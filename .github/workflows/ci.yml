name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Fast tests
        run: pnpm test:fast
      - name: Validate content (TypeScript)
        run: pnpm validate:content
      - name: Validate content (Python)
        run: python3 scripts/validate_content.py

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Integration tests
        run: pnpm test:integration

  certification:
    name: Certification
    runs-on: ubuntu-latest
    # Phase 15 matrix: 3×25 + 2×50 + 1×100 years.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Phase 15 long-run certification
        run: pnpm test:certification
      - name: Upload long-run audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-longrun-audit
          path: docs/qa/phase15/longrun-audit.json
          if-no-files-found: warn
